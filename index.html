<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NMMS ప్రాక్టీస్ – MAT & SAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@600;800&family=Noto+Sans+Telugu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --ink:#1F3B6E; --rule:#D7E2F0; --form:#B23A48;
  --lead:#2A2D34; --ok:#2F7D4A; --bad:#B3261E; --soft:#EEF3FA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--lead);font-family:'Noto Sans Telugu',system-ui,sans-serif;line-height:1.65;font-size:17px;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--form);outline-offset:2px}
.top{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .brand{font-family:'Baloo Tamma 2',sans-serif;font-weight:800;font-size:20px;flex:1;letter-spacing:.2px}
.top button{background:transparent;border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:8px;padding:5px 11px;font-size:15px}
.top button.on{background:#fff;color:var(--ink)}
.marks{height:9px;background:repeating-linear-gradient(90deg,var(--lead) 0 12px,transparent 12px 28px);opacity:.85}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 30px}
h1{font-family:'Baloo Tamma 2',sans-serif;font-weight:800;font-size:clamp(34px,8vw,52px);line-height:1.05;margin:8px 0 6px;color:var(--ink)}
h2{font-family:'Baloo Tamma 2',sans-serif;font-size:24px;margin:0 0 8px;color:var(--ink)}
h3{font-size:16px;margin:0 0 8px;color:var(--ink)}
.lede{margin:0 0 16px;max-width:60ch}
.pattern{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--form);border-radius:10px;overflow:hidden;background:#fff;margin-bottom:18px}
.pattern div{padding:10px 8px;text-align:center;border-right:1px solid var(--rule)}
.pattern div:last-child{border-right:0}
.pattern b{display:block;font-family:'Baloo Tamma 2',sans-serif;font-size:26px;color:var(--form);line-height:1.1}
.pattern span{font-size:13px}
.note{font-size:14px;color:#555;margin:-8px 0 18px}
.panel{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:16px}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--rule);background:#fff;color:var(--lead);border-radius:999px;padding:7px 14px;font-size:15px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:14px;color:#555;margin:8px 0 0}
.fld{display:block;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:16px}
.fld input{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;font:inherit;background:var(--paper)}
.pri{background:var(--form);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:17px}
.pri.wide{width:100%;padding:15px;font-size:19px}
.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:11px 18px;font-weight:500}
.ghost:disabled{opacity:.35;cursor:not-allowed}
.resume{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--soft);border:1.5px dashed var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
.hist li:last-child{border-bottom:0}
.hist .p{font-weight:700}
.qbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.qbar .no{font-size:16px}
.qbar .no b{font-family:'Baloo Tamma 2',sans-serif;font-size:24px;color:var(--ink)}
.tag{background:var(--soft);color:var(--ink);border-radius:6px;padding:2px 10px;font-size:14px}
.timer{margin-left:auto;font-family:'Baloo Tamma 2',sans-serif;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.live{margin-left:auto;font-size:15px}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ink)}
.qcard{background:#fff;border:1px solid var(--rule);border-left:6px solid var(--form);border-radius:12px;padding:18px 16px}
.qtext{font-size:19px;font-weight:500;white-space:pre-line;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:11px 12px;color:var(--lead);font-size:17px}
.opt:hover{border-color:var(--ink)}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--form);color:var(--form);display:grid;place-items:center;font-weight:700;font-size:14px;font-family:system-ui,sans-serif;transition:background .15s}
.opt.sel{border-color:var(--lead)}
.opt.sel .bub{background:var(--lead);border-color:var(--lead);color:#fff}
.opt.right{border-color:var(--ok);background:#EEF7F0}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FBEDEC}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.expl{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:16px}
.expl.ok{background:#EEF7F0;border:1px solid #BFDCC8}
.expl.bad{background:#FBEDEC;border:1px solid #EBC3BF}
.expl p{margin:4px 0 0}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.endnow{display:block;margin:14px auto 0;background:none;border:0;color:var(--ink);text-decoration:underline;font-size:15px}
.sheet{margin-top:18px;background:#fff;border:1.5px solid var(--form);border-radius:12px;padding:12px 14px}
.sheet summary{font-weight:700;color:var(--form);cursor:pointer}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px;margin:12px 0}
.pal button{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--form);background:#fff;color:var(--form);font-size:13px;padding:0;font-family:system-ui,sans-serif}
.pal button.f{background:var(--lead);border-color:var(--lead);color:#fff}
.pal button.c{outline:3px solid var(--ink);outline-offset:2px}
.legend{font-size:13px;color:#555;margin:0 0 10px}
.score{text-align:center;padding:10px 0 4px}
.score .big{font-family:'Baloo Tamma 2',sans-serif;font-weight:800;font-size:clamp(56px,16vw,84px);line-height:1;color:var(--ink)}
.score .big small{font-size:.4em;color:var(--lead)}
.verdict{text-align:center;font-weight:700;border-radius:10px;padding:10px;margin:12px 0 0}
.verdict.ok{background:#EEF7F0;color:var(--ok)}
.verdict.bad{background:#FBEDEC;color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:left}
th{color:var(--ink);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.parts div{background:var(--soft);border-radius:10px;padding:8px;text-align:center;font-size:14px}
.parts b{display:block;font-size:20px;color:var(--ink)}
.rv{border-bottom:1px solid var(--rule);padding:12px 0}
.rv:last-child{border-bottom:0}
.rv .q{font-weight:500;white-space:pre-line;margin:0 0 6px}
.rv .a{font-size:15px;margin:2px 0}
.rv .e{font-size:14px;color:#444;margin:4px 0 0}
.g{color:var(--ok);font-weight:700}.r{color:var(--bad);font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
footer{text-align:center;padding:18px 16px 26px;font-size:15px;border-top:1px solid var(--rule);margin-top:10px}
footer a{color:var(--form);font-weight:700;text-decoration:none;font-family:'Baloo Tamma 2',sans-serif;font-size:19px}
footer a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.marks,footer .no-print,.btns{display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="brand">NMMS ప్రాక్టీస్</span>
  <button id="ttsBtn" aria-pressed="false" title="తెలుగు వాయిస్">🔊 వాయిస్</button>
  <button id="homeBtn">హోమ్</button>
</div>
<div class="marks" aria-hidden="true"></div>
<main class="wrap" id="app"></main>
<footer>తయారీ: <a href="https://raayeducation.in" target="_blank" rel="noopener">రాయ్ ఎడ్యుకేషన్</a></footer>

<script>

['mat','ఒక స్త్రీ ఫోటోలోని అబ్బాయిని చూపిస్తూ "ఇతని తల్లి, నా తల్లికి ఏకైక కుమార్తె" అన్నది. ఆ స్త్రీ ఆ అబ్బాయికి ఏమవుతుంది?',['తల్లి','అక్క','అత్త','అమ్మమ్మ'],0,'"నా తల్లికి ఏకైక కుమార్తె" అంటే ఆ స్త్రీయే. కాబట్టి ఆమె అబ్బాయికి తల్లి.'],

['phy','ధ్వని కింది వాటిలో దేని ద్వారా ప్రయాణించలేదు?',['శూన్యం','గాలి','నీరు','ఇనుము'],0,'ధ్వని ప్రయాణానికి యానకం అవసరం; శూన్యంలో యానకం లేదు.'],

function numOpts(ans,sp){const s=new Set([ans]);let g=0;while(s.size<4&&g<300){g++;const d=R(1,Math.max(2,sp));const v=Math.random()<.5?ans-d:ans+d;if(v>0)s.add(v);}let k=1;while(s.size<4){s.add(ans+k);k++;}return [...s];}
function mk(s,q,ans,opts,e){ans=String(ans);let o=[...new Set(opts.map(String))].filter(x=>x!==ans);if(o.length<3&&/^\d+$/.test(ans)){let k=1;while(o.length<3){const v=String(+ans+k);if(!o.includes(v))o.push(v);k++;}}o=shuffle([ans,...o.slice(0,3)]);return{s,q,o,a:o.indexOf(ans),e};}
function fromStatic(r){const [s,q,o,a,e]=r;const ans=o[a];const so=shuffle(o);return{s,q,o:so,a:so.indexOf(ans),e};}

];

/* ================= ప్రశ్నల సెట్ తయారీ ================= */
const SUB={mat:'MAT',phy:'భౌతిక శాస్త్రం',che:'రసాయన శాస్త్రం',bio:'జీవ శాస్త్రం',mth:'గణితం',his:'చరిత్ర',geo:'భూగోళ శాస్త్రం',pol:'పౌర శాస్త్రం',eco:'అర్థశాస్త్రం'};
const WT={phy:12,che:11,bio:12,mth:20,his:10,geo:10,pol:10,eco:5};
const SATK=Object.keys(WT);
function fill(n,staticShare,sub,gens){
  const st=shuffle(BANK.filter(r=>r[0]===sub)).slice(0,Math.round(n*staticShare)).map(fromStatic);
  const seen=new Set(st.map(x=>x.q)),out=[...st];let order=shuffle(gens),gi=0,guard=0;
  while(out.length<n&&guard<n*80){guard++;if(gi>=order.length){order=shuffle(gens);gi=0;}const x=order[gi++]();if(!seen.has(x.q)){seen.add(x.q);out.push(x);}}
  return shuffle(out);
}
const buildMAT=n=>fill(n,.2,'mat',MATG);
const mathQs=n=>fill(n,.35,'mth',MTHG);
const poolSize=s=>BANK.filter(r=>r[0]===s).length;
function buildSAT(n,sub){
  if(sub==='mth')return mathQs(n);
  if(sub!=='all')return shuffle(BANK.filter(r=>r[0]===sub)).slice(0,n).map(fromStatic);
  const q={};let tot=0;SATK.forEach(k=>{q[k]=Math.floor(n*WT[k]/90);tot+=q[k];});q.mth+=n-tot;
  const grp={};
  SATK.forEach(k=>{if(k==='mth')return;const take=shuffle(BANK.filter(r=>r[0]===k)).slice(0,q[k]).map(fromStatic);grp[k]=take;q.mth+=q[k]-take.length;});
  grp.mth=mathQs(q.mth);
  return SATK.flatMap(k=>grp[k]||[]);
}

/* ================= స్థితి / నిల్వ ================= */
const ls={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
let cfg=Object.assign({test:'MAT',mode:'practice',sub:'all',count:20,cat:'gen',name:''},ls.get('nmms_cfg')||{});
let S=null,screen='home',reviewFilter='wrong';
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const testLabel=c=>c.test==='FULL'?'పూర్తి మాక్ టెస్ట్':c.test==='SAT'?('SAT'+(c.sub!=='all'?' ('+SUB[c.sub]+')':'')):'MAT';
const fmtT=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const save=()=>{if(S)ls.set('nmms_s',S);};

/* ================= వాయిస్ ================= */
let tts=!!ls.get('nmms_tts');
const ttsBtn=document.getElementById('ttsBtn');
function syncTts(){ttsBtn.classList.toggle('on',tts);ttsBtn.setAttribute('aria-pressed',tts);ttsBtn.textContent=tts?'🔊 వాయిస్ ఆన్':'🔇 వాయిస్';}
function speak(t){if(!tts||!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\n/g,'. '));u.lang='te-IN';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('te'));if(v)u.voice=v;u.rate=.95;speechSynthesis.speak(u);}
ttsBtn.onclick=()=>{tts=!tts;ls.set('nmms_tts',tts);syncTts();if(!tts&&'speechSynthesis' in window)speechSynthesis.cancel();else if(screen==='quiz')readQ();};
function readQ(){const q=S.qs[S.cur];speak(q.q+'. '+q.o.map((o,k)=>'ABCD'[k]+'. '+o).join('. '));}
document.getElementById('homeBtn').onclick=()=>{save();if('speechSynthesis' in window)speechSynthesis.cancel();renderHome();};

/* ================= హోమ్ ================= */
function seg(key,items,dis){return `<div class="seg" role="group">${items.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${String(cfg[key])===String(v)?'on':''}" ${dis&&dis(v)?'disabled':''}>${l}</button>`).join('')}</div>`;}
function renderHome(){
  screen='home';
  const sv=ls.get('nmms_s');const hist=ls.get('nmms_h')||[];
  const isSAT=cfg.test==='SAT',isFull=cfg.test==='FULL';
  const cap=isSAT&&cfg.sub!=='all'&&cfg.sub!=='mth'?poolSize(cfg.sub):Infinity;
  if(cfg.count>cap)cfg.count=[10,20,30,45,90].filter(x=>x<=cap).pop()||cap;
  app.innerHTML=`
  <h1>NMMS ప్రాక్టీస్</h1>
  <p class="lede">జాతీయ ప్రతిభా ఉపకార వేతన పరీక్షకు సాధన. 7వ తరగతి పూర్తి సిలబస్, 8వ తరగతి అక్టోబర్ వరకు.</p>
  <div class="pattern"><div><b>90</b><span>MAT ప్రశ్నలు</span></div><div><b>90</b><span>SAT ప్రశ్నలు</span></div><div><b>180</b><span>నిమిషాలు</span></div></div>
  <p class="note">ప్రతి ప్రశ్నకు 1 మార్కు. నెగటివ్ మార్కింగ్ లేదు. అర్హత: రెండు పరీక్షలు కలిపి 40% (SC/ST కి 32%).</p>
  ${sv&&!sv.done?`<div class="resume"><div><b>మధ్యలో ఆపిన పరీక్ష ఉంది</b><br><span style="font-size:15px">${esc(testLabel(sv.cfg))}: ${sv.ans.filter(x=>x!==null).length} / ${sv.qs.length} పూర్తి</span></div><div class="btns" style="margin:0"><button class="pri" id="resBtn">కొనసాగించండి</button><button class="ghost" id="dropBtn">రద్దు</button></div></div>`:''}
  <section class="panel">
    <label class="fld">విద్యార్థి పేరు (ఐచ్ఛికం)<input id="nm" value="${esc(cfg.name)}" maxlength="40" autocomplete="off"></label>
    <div class="grp"><h3>పరీక్ష</h3>${seg('test',[['MAT','MAT'],['SAT','SAT'],['FULL','పూర్తి మాక్ టెస్ట్ (MAT + SAT)']])}</div>
    ${isSAT?`<div class="grp"><h3>SAT విషయం (మార్కులు)</h3>${seg('sub',[['all','అన్నీ (90 మార్కుల నమూనాలో)'],...SATK.map(k=>[k,`${SUB[k]} (${WT[k]})`])])}</div>`:''}
    <div class="grp"><h3>విధానం</h3>${seg('mode',[['practice','ప్రాక్టీస్'],['exam','పరీక్ష (టైమర్‌తో)']])}
      <p class="hint">${cfg.mode==='practice'?'ప్రతి ప్రశ్నకు వెంటనే సరైన జవాబు, వివరణ కనిపిస్తాయి.':'నిజమైన పరీక్షలా: ఒక్కో ప్రశ్నకు 1 నిమిషం. సమర్పించిన తర్వాతే ఫలితం.'}</p></div>
    ${isFull?'<p class="hint" style="margin:-6px 0 16px">MAT 90 + SAT 90 = 180 ప్రశ్నలు, 180 నిమిషాలు.</p>':`<div class="grp"><h3>ప్రశ్నల సంఖ్య</h3>${seg('count',[10,20,30,45,90].map(x=>[x,String(x)]),v=>v>cap)}${cap!==Infinity?`<p class="hint">ఈ విషయంలో ${cap} ప్రశ్నలు అందుబాటులో ఉన్నాయి.</p>`:''}</div>`}
    <div class="grp"><h3>వర్గం (అర్హత కట్-ఆఫ్ కోసం)</h3>${seg('cat',[['gen','జనరల్ / BC (40%)'],['sc','SC / ST (32%)']])}</div>
    <button class="pri wide" id="goBtn">ప్రారంభించండి</button>
  </section>
  ${hist.length?`<section class="panel"><h2>గత ఫలితాలు</h2><ul class="hist">${hist.slice(0,8).map(h=>`<li><span>${esc(h.d)}${h.n?' – '+esc(h.n):''}<br><small>${esc(h.t)}</small></span><span class="p" style="color:${h.ok?'var(--ok)':'var(--bad)'}">${h.c}/${h.tt} (${h.p}%)</span></li>`).join('')}</ul></section>`:''}
  `;
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;cfg[k]=k==='count'?+b.dataset.v:b.dataset.v;ls.set('nmms_cfg',cfg);renderHome();});
  document.getElementById('nm').oninput=e=>{cfg.name=e.target.value;ls.set('nmms_cfg',cfg);};
  document.getElementById('goBtn').onclick=start;
  const rb=document.getElementById('resBtn');if(rb){rb.onclick=()=>{S=sv;renderQuiz();};document.getElementById('dropBtn').onclick=()=>{if(confirm('మధ్యలో ఆపిన పరీక్షను రద్దు చేయాలా?')){ls.del('nmms_s');renderHome();}};}
}

function start(){
  const c=Object.assign({},cfg);let qs;
  if(c.test==='FULL')qs=[...buildMAT(90),...buildSAT(90,'all')];
  else if(c.test==='MAT')qs=buildMAT(c.count);
  else qs=buildSAT(c.count,c.sub);
  S={cfg:c,qs,ans:Array(qs.length).fill(null),cur:0,left:c.mode==='exam'?qs.length*60:null,done:false};
  save();renderQuiz();
}

/* ================= క్విజ్ ================= */
function renderQuiz(){
  screen='quiz';
  const i=S.cur,q=S.qs[i],n=S.qs.length,ex=S.cfg.mode==='exam',a=S.ans[i];
  const answered=S.ans.filter(x=>x!==null).length;
  const right=S.ans.reduce((s,x,k)=>s+(x===S.qs[k].a?1:0),0);
  const cls=k=>{if(ex)return k===a?'sel':'';if(a===null)return '';if(k===q.a)return 'right';if(k===a)return 'wrong';return 'dim';};
  app.innerHTML=`
  <div class="qbar"><span class="no">ప్రశ్న <b>${i+1}</b> / ${n}</span><span class="tag">${SUB[q.s]}</span>
   ${ex?`<span class="timer ${S.left<300?'low':''}" id="tm" aria-label="మిగిలిన సమయం">${fmtT(S.left)}</span>`:`<span class="live">సరైనవి <b>${right}</b> / ${answered}</span>`}</div>
  <div class="prog"><i style="width:${answered/n*100}%"></i></div>
  <article class="qcard">
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt ${cls(k)}" data-k="${k}"><span class="bub">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${!ex&&a!==null?`<div class="expl ${a===q.a?'ok':'bad'}"><b>${a===q.a?'సరైన జవాబు!':'తప్పు. సరైన జవాబు: '+'ABCD'[q.a]+') '+esc(q.o[q.a])}</b><p>${esc(q.e)}</p></div>`:''}
  </article>
  <div class="navb">
    <button class="ghost" id="prev" ${i===0?'disabled':''}>ముందు ప్రశ్న</button>
    ${i<n-1?`<button class="pri" id="next">తర్వాత ప్రశ్న</button>`:`<button class="pri" id="fin">${ex?'పరీక్ష సమర్పించు':'ఫలితం చూడండి'}</button>`}
  </div>
  ${ex?`<details class="sheet" id="sheet" ${S.pal?'open':''}><summary>జవాబు పత్రం: ${answered} / ${n} గుర్తించారు</summary>
     <p class="legend">నిండిన వృత్తం = జవాబు గుర్తించారు. నొక్కితే ఆ ప్రశ్నకు వెళ్తుంది.</p>
     <div class="pal">${S.ans.map((x,k)=>`<button data-j="${k}" class="${x!==null?'f':''} ${k===i?'c':''}">${k+1}</button>`).join('')}</div>
     <button class="pri" id="fin2">పరీక్ష సమర్పించు</button></details>`
   :(i<n-1?`<button class="endnow" id="fin3">ఇక్కడితో ముగించి ఫలితం చూడండి</button>`:'')}
  `;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  document.getElementById('prev').onclick=()=>go(-1);
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>go(1);
  ['fin','fin2','fin3'].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=finish;});
  const sh=document.getElementById('sheet');if(sh)sh.ontoggle=()=>{S.pal=sh.open;};
  app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.j;save();renderQuiz();});
  readQ();
}
function choose(k){
  const ex=S.cfg.mode==='exam';
  if(!ex&&S.ans[S.cur]!==null)return;
  S.ans[S.cur]=k;save();renderQuiz();
  if(!ex){const q=S.qs[S.cur];speak((k===q.a?'సరైన జవాబు. ':'తప్పు. సరైన జవాబు '+q.o[q.a]+'. ')+q.e);}
}
function go(d){const j=S.cur+d;if(j<0||j>=S.qs.length)return;S.cur=j;save();renderQuiz();window.scrollTo({top:0});}
function finish(auto){
  if(auto!==true){const un=S.ans.filter(x=>x===null).length;
    if(S.cfg.mode==='exam'&&!confirm(un?`${un} ప్రశ్నలకు జవాబు గుర్తించలేదు. అయినా సమర్పించాలా?`:'పరీక్షను సమర్పించాలా?'))return;}
  S.done=true;
  const c=S.ans.reduce((s,x,k)=>s+(x===S.qs[k].a?1:0),0),tt=S.qs.length,p=Math.round(c/tt*1000)/10;
  const cut=S.cfg.cat==='sc'?32:40;
  const hist=ls.get('nmms_h')||[];
  hist.unshift({d:new Date().toLocaleDateString('en-IN'),n:S.cfg.name,t:testLabel(S.cfg)+(S.cfg.mode==='exam'?' – పరీక్ష':' – ప్రాక్టీస్'),c,tt,p,ok:p>=cut});
  ls.set('nmms_h',hist.slice(0,30));
  save();reviewFilter='wrong';renderResult();
}
setInterval(()=>{
  if(screen!=='quiz'||!S||S.done||S.cfg.mode!=='exam')return;
  S.left--;const tm=document.getElementById('tm');
  if(tm){tm.textContent=fmtT(S.left);tm.classList.toggle('low',S.left<300);}
  if(S.left%5===0)save();
  if(S.left<=0){alert('సమయం ముగిసింది. పరీక్ష సమర్పించబడింది.');finish(true);}
},1000);

/* ================= ఫలితం ================= */
function renderResult(){
  screen='result';if('speechSynthesis' in window)speechSynthesis.cancel();
  const by={};S.qs.forEach((q,i)=>{(by[q.s]=by[q.s]||{c:0,t:0}).t++;if(S.ans[i]===q.a)by[q.s].c++;});
  const c=Object.values(by).reduce((s,x)=>s+x.c,0),tt=S.qs.length,p=Math.round(c/tt*1000)/10;
  const cut=S.cfg.cat==='sc'?32:40,ok=p>=cut;
  const order=['mat',...SATK].filter(k=>by[k]);
  const satC=SATK.reduce((s,k)=>s+(by[k]?by[k].c:0),0),satT=SATK.reduce((s,k)=>s+(by[k]?by[k].t:0),0);
  const un=S.ans.filter(x=>x===null).length;
  const list=S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(x=>reviewFilter==='all'||x.a!==x.q.a);
  app.innerHTML=`
  <section class="panel">
    <h2>${esc(testLabel(S.cfg))} ఫలితం${S.cfg.name?' – '+esc(S.cfg.name):''}</h2>
    <div class="score"><div class="big">${c}<small> / ${tt}</small></div><div>${p}%</div></div>
    ${S.cfg.test==='FULL'?`<div class="parts"><div><b>${by.mat?by.mat.c:0}/90</b>MAT</div><div><b>${satC}/${satT}</b>SAT</div><div><b>${c}/180</b>మొత్తం</div></div>`:''}
    <div class="verdict ${ok?'ok':'bad'}">${ok?`అర్హత కట్-ఆఫ్ (${cut}%) దాటారు. ఇలాగే సాధన కొనసాగించండి.`:`అర్హతకు ${cut}% కావాలి. ఇంకా ${Math.ceil(cut*tt/100)-c} మార్కులు పెంచుకోవాలి.`}</div>
    ${un?`<p class="hint" style="text-align:center">జవాబు ఇవ్వని ప్రశ్నలు: ${un}</p>`:''}
  </section>
  <section class="panel">
    <h2>విషయాల వారీగా</h2>
    <table><thead><tr><th>విషయం</th><th class="n">మార్కులు</th><th style="width:35%"></th></tr></thead><tbody>
    ${order.map(k=>{const x=by[k],pp=Math.round(x.c/x.t*100);return `<tr><td>${SUB[k]}</td><td class="n">${x.c}/${x.t}</td><td><div class="bar"><i style="width:${pp}%;background:${pp>=cut?'var(--ok)':'var(--bad)'}"></i></div></td></tr>`;}).join('')}
    </tbody></table>
  </section>
  <section class="panel">
    <h2>జవాబుల సమీక్ష</h2>
    <div class="seg" style="margin-bottom:8px"><button data-f="wrong" class="${reviewFilter==='wrong'?'on':''}">తప్పులు మాత్రమే (${tt-c})</button><button data-f="all" class="${reviewFilter==='all'?'on':''}">అన్ని ప్రశ్నలు (${tt})</button></div>
    ${list.length?list.map(({q,i,a})=>`<div class="rv"><p class="q">${i+1}. ${esc(q.q)}</p>
      <p class="a">మీ జవాబు: ${a===null?'<span class="r">ఇవ్వలేదు</span>':`<span class="${a===q.a?'g':'r'}">${'ABCD'[a]}) ${esc(q.o[a])}</span>`}</p>
      ${a!==q.a?`<p class="a">సరైన జవాబు: <span class="g">${'ABCD'[q.a]}) ${esc(q.o[q.a])}</span></p>`:''}
      <p class="e">${esc(q.e)}</p></div>`).join(''):'<p>అన్నీ సరైనవే. అద్భుతం!</p>'}
    <div class="btns"><button class="pri" id="again">కొత్త ప్రశ్నలతో మళ్ళీ</button><button class="ghost" id="hm">హోమ్</button><button class="ghost" id="pr">ప్రింట్</button></div>
  </section>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;renderResult();});
  document.getElementById('again').onclick=()=>{cfg=Object.assign(cfg,S.cfg);start();};
  document.getElementById('hm').onclick=renderHome;
  document.getElementById('pr').onclick=()=>window.print();
  window.scrollTo({top:0});
}

/* ================= కీబోర్డ్ / రిమోట్ ================= */
document.addEventListener('keydown',e=>{
  if(screen!=='quiz'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();const map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  if(k in map){choose(map[k]);e.preventDefault();}
  else if(e.key==='ArrowRight'||(e.key==='Enter'&&e.target===document.body)){if(S.cur<S.qs.length-1)go(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){go(-1);e.preventDefault();}
});

if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
syncTts();
renderHome();
</script>
</body>
</html>
